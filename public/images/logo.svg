<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="avnivoNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102F59" />
      <stop offset="100%" stop-color="#0B1E38" />
    </linearGradient>
    <linearGradient id="avnivoOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9433" />
      <stop offset="100%" stop-color="#FF7900" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Outer Navy Base -->
  <circle cx="256" cy="256" r="248" fill="url(#avnivoNavy)" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- Outer Accent Orange Ring with subtle break -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#avnivoOrange)" stroke-width="8" stroke-dasharray="1200 40" stroke-linecap="round"/>
  
  <!-- Inner Decorative Ring -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Center Emblem: Stylized Home Roof & A-Monogram -->
  <g filter="url(#shadow)">
    <!-- Roof Peak (Orange) -->
    <path d="M160 250 L256 160 L352 250" fill="none" stroke="url(#avnivoOrange)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Home Hearth / Triangle 'A' (White) -->
    <path d="M256 186 L320 286 L192 286 Z" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Chimney / Kitchen Steam (Warm Orange) -->
    <rect x="300" y="180" width="16" height="34" rx="4" fill="url(#avnivoOrange)"/>
    
    <!-- Smart Leaf / Living Accent in Center -->
    <path d="M256 240 C270 240 280 252 280 268 C265 268 256 256 256 240 Z" fill="#FF7900"/>
    <path d="M256 240 C242 240 232 252 232 268 C247 268 256 256 256 240 Z" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography: AVNIVO -->
  <text x="256" y="360" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="7">AVNIVO</text>
  
  <!-- Tagline: SMART LIVING • BETTER HOME -->
  <text x="256" y="394" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="600" font-size="16" fill="#FF7900" text-anchor="middle" letter-spacing="4">SMART LIVING • BETTER HOME</text>

  <!-- Circular Stars / Dots -->
  <circle cx="118" cy="256" r="6" fill="#FF7900"/>
  <circle cx="394" cy="256" r="6" fill="#FF7900"/>
</svg>

